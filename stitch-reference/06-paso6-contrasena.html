<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Paso 6: Crear contraseña - Carmen Ligia Barceló</title>
<!-- Tailwind CSS CDN con plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0B2545',
              blue: '#134074',
              orange: '#FF5E00',
              orangeHover: '#E05300',
              lightGray: '#F4F6F9',
              border: '#E2E8F0',
              success: '#10B981',
              muted: '#64748B'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="mobile-viewport-styling">
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #0f172a;
    }
    .ios-status-bar {
      height: env(safe-area-inset-top, 44px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-800">
<!-- BEGIN: MobileContainer -->
<!-- Contenedor con aspecto de dispositivo iPhone (dimensiones típicas de mockup iOS) -->
<main class="w-full max-w-[390px] h-[844px] bg-white sm:rounded-[44px] shadow-2xl flex flex-col justify-between overflow-hidden relative border-0 sm:border-[8px] sm:border-slate-800">
<!-- BEGIN: TopBarArea -->
<!-- Barra de estado y notch superior iOS -->
<header class="w-full bg-white pt-2 px-6 flex flex-col shrink-0 z-10" data-purpose="screen-header">
<!-- Indicador de barra de estado iPhone -->
<div class="h-6 w-full flex justify-between items-center text-xs font-semibold text-slate-900 mb-2">
<span>9:41</span>
<div class="w-20 h-4 bg-black rounded-full mx-auto hidden sm:block"></div>
<div class="flex items-center gap-1.5">
<!-- Iconos de señal, wifi y batería -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"></path></svg>
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path></svg>
<div class="w-5 h-2.5 border border-slate-900 rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-slate-900 rounded-2xs"></div>
</div>
</div>
</div>
<!-- Barra de navegación con botón volver y logo institucional -->
<div class="flex items-center justify-between py-3 border-b border-slate-100">
<!-- Botón Volver '<' -->
<button aria-label="Volver" class="p-1 -ml-1 text-slate-700 hover:text-slate-950 transition-colors" type="button">
<svg class="w-6 h-6 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>
</button>
<!-- Logotipo centrado: CARMEN LIGIA BARCELÓ -->
<div class="flex items-center gap-2 pr-5">
<div class="w-8 h-8 rounded-full border-2 border-brand-blue flex items-center justify-center bg-blue-50/50">
<!-- Icono de pulgar arriba estilizado en círculo -->
<svg class="w-4 h-4 text-brand-blue fill-current" viewbox="0 0 24 24">
<path d="M2 20h2c.55 0 1-.45 1-1v-9c0-.55-.45-1-1-1H2v11zm19.83-7.12c.11-.25.17-.52.17-.8V11c0-1.1-.9-2-2-2h-5.5l.92-4.65c.05-.22.02-.45-.08-.66-.23-.49-.78-.79-1.34-.79h-.03c-.55 0-1.05.3-1.3.78L9 9.17V19h10.1c.78 0 1.45-.48 1.73-1.2l1-2.58z"></path>
</svg>
</div>
<div class="flex flex-col text-left leading-none">
<span class="text-[9px] font-semibold text-slate-500 tracking-wider">PROYECTO</span>
<span class="text-xs font-black tracking-tight text-brand-navy">CARMEN LIGIA</span>
<span class="text-xs font-black tracking-wider text-brand-navy -mt-0.5">BARCELÓ</span>
</div>
</div>
<div class="w-4"></div>
</div>
</header>
<!-- END: TopBarArea -->
<!-- BEGIN: FormContent -->
<!-- Contenido central scrolleable con el formulario del Paso 6 -->
<div class="flex-1 overflow-y-auto px-6 py-4 flex flex-col justify-start" data-purpose="registration-step-content">
<!-- Título de la pantalla -->
<div class="mb-4">
<h1 class="text-xl font-bold text-slate-900 tracking-tight">Crear contraseña</h1>
<p class="text-xs text-slate-500 mt-0.5">Define una contraseña segura para tu acceso</p>
</div>
<!-- Formulario de contraseña -->
<form class="space-y-4" id="passwordForm" onsubmit="event.preventDefault();">
<!-- Campo: Contraseña * -->
<div class="space-y-1">
<label class="block text-xs font-semibold text-slate-700" for="password">
            Contraseña <span class="text-red-500">*</span>
</label>
<div class="relative">
<input class="w-full text-sm py-2.5 pl-3.5 pr-10 border border-slate-300 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-blue/30 focus:border-brand-blue transition-all" id="password" placeholder="••••••••••••" type="password" value="ClbSegura2026@"/>
<!-- Botón Ojo Mostrar/Ocultar -->
<button aria-label="Ver u ocultar contraseña" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" data-purpose="password-visibility-toggle" id="togglePassword" type="button">
<svg class="w-4 h-4 stroke-current" fill="none" id="eyeIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
</div>
<!-- Lista de Requisitos de Seguridad (Checks verdes activos) -->
<div class="bg-slate-50 rounded-xl p-3 border border-slate-100" data-purpose="security-rules-checklist">
<ul class="space-y-2 text-xs">
<!-- Regla 1: 8 caracteres -->
<li class="flex items-center gap-2 text-emerald-600 font-medium">
<span class="w-4 h-4 rounded-full bg-emerald-100 flex items-center justify-center shrink-0">
<svg class="w-2.5 h-2.5 text-emerald-600 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span>Al menos 8 caracteres</span>
</li>
<!-- Regla 2: Letra mayúscula -->
<li class="flex items-center gap-2 text-emerald-600 font-medium">
<span class="w-4 h-4 rounded-full bg-emerald-100 flex items-center justify-center shrink-0">
<svg class="w-2.5 h-2.5 text-emerald-600 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span>Una letra mayúscula</span>
</li>
<!-- Regla 3: Letra minúscula -->
<li class="flex items-center gap-2 text-emerald-600 font-medium">
<span class="w-4 h-4 rounded-full bg-emerald-100 flex items-center justify-center shrink-0">
<svg class="w-2.5 h-2.5 text-emerald-600 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span>Una letra minúscula</span>
</li>
<!-- Regla 4: Un número -->
<li class="flex items-center gap-2 text-emerald-600 font-medium">
<span class="w-4 h-4 rounded-full bg-emerald-100 flex items-center justify-center shrink-0">
<svg class="w-2.5 h-2.5 text-emerald-600 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span>Un número</span>
</li>
<!-- Regla 5: Carácter especial -->
<li class="flex items-center gap-2 text-emerald-600 font-medium">
<span class="w-4 h-4 rounded-full bg-emerald-100 flex items-center justify-center shrink-0">
<svg class="w-2.5 h-2.5 text-emerald-600 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span>Un carácter especial (ej. ! @ # $ %)</span>
</li>
</ul>
</div>
<!-- Campo: Confirmar contraseña * -->
<div class="space-y-1 pt-1">
<label class="block text-xs font-semibold text-slate-700" for="confirmPassword">
            Confirmar contraseña <span class="text-red-500">*</span>
</label>
<div class="relative">
<input class="w-full text-sm py-2.5 pl-3.5 pr-10 border border-slate-300 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-blue/30 focus:border-brand-blue transition-all" id="confirmPassword" placeholder="••••••••••••" type="password" value="ClbSegura2026@"/>
<!-- Botón Ojo Confirmar contraseña -->
<button aria-label="Ver u ocultar confirmación de contraseña" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" data-purpose="confirm-password-visibility-toggle" id="toggleConfirmPassword" type="button">
<svg class="w-4 h-4 stroke-current" fill="none" id="eyeConfirmIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
</div>
</form>
</div>
<!-- END: FormContent -->
<!-- BEGIN: FooterActionArea -->
<!-- Contenedor inferior fijo con botón de acción y pie institucional -->
<footer class="p-6 bg-white shrink-0 border-t border-slate-50 flex flex-col items-center gap-4" data-purpose="screen-footer">
<!-- Botón CONTINUAR en color naranja vibrante oficial (#FF5E00 / #FF7020) -->
<button class="w-full py-3.5 px-6 bg-brand-orange hover:bg-brand-orangeHover active:scale-[0.99] text-white text-sm font-bold tracking-wide rounded-xl shadow-md shadow-brand-orange/30 transition-all uppercase text-center flex items-center justify-center" data-purpose="continue-registration-button" id="continueBtn" type="button">
        CONTINUAR
      </button>
<!-- Pie de página institucional consistente de la app -->
<div class="text-center">
<p class="text-[10px] tracking-wider font-semibold text-slate-400 uppercase">
          Trabajo • Organización • Resultados
        </p>
</div>
<!-- Barra de navegación por gestos (Home indicator iOS) -->
<div class="w-32 h-1 bg-slate-300 rounded-full mx-auto -mb-2"></div>
</footer>
<!-- END: FooterActionArea -->
</main>
<!-- END: MobileContainer -->
<!-- BEGIN: InteractiveHandlers -->
<script data-purpose="password-visibility-script">
    // Control básico de alternancia de visualización de contraseñas
    const togglePass = document.getElementById('togglePassword');
    const passInput = document.getElementById('password');
    
    togglePass.addEventListener('click', function() {
      const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passInput.setAttribute('type', type);
    });

    const toggleConfirm = document.getElementById('toggleConfirmPassword');
    const confirmInput = document.getElementById('confirmPassword');

    toggleConfirm.addEventListener('click', function() {
      const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
      confirmInput.setAttribute('type', type);
    });
  </script>
<!-- END: InteractiveHandlers -->
</body></html>
