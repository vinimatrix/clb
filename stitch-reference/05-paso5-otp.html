<script data-purpose="otp-input-behavior">
    // Logic for auto-focusing between 5 OTP boxes
    document.addEventListener('DOMContentLoaded', () => {
      const inputs = document.querySelectorAll('.otp-field');

      inputs.forEach((input, index) => {
        // Focus next when a digit is entered
        input.addEventListener('input', (e) => {
          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
            inputs[index + 1].select();
          }
        });

        // Handle backspace to focus previous box
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        // Paste whole code handling
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = e.clipboardData.getData('text').trim();
          if (/^\d+$/.test(pasteData)) {
            pasteData.split('').slice(0, inputs.length).forEach((char, i) => {
              inputs[i].value = char;
            });
            const nextIdx = Math.min(pasteData.length, inputs.length - 1);
            inputs[nextIdx].focus();
          }
        });
      });
    });
  </script>
<script data-purpose="countdown-timer-behavior">
    // Subtle countdown for SMS resend
    let timeLeft = 54;
    const timerElem = document.getElementById('countdown-timer');

    if (timerElem) {
      const countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          timerElem.textContent = '(Disponible)';
        } else {
          const formatted = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
          timerElem.textContent = `(00:${formatted})`;
        }
      }, 1000);
    }
  </script>
