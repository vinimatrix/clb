<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Carmen Ligia Barceló - Portal Móvil</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'clb-navy': '#0d3269',
            'clb-blue': '#124fad',
            'clb-orange': '#f26822',
            'clb-orange-hover': '#e05915',
            'clb-cyan': '#009fe3',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Montserrat', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles for Layout & Visual Details -->
<style data-purpose="status-bar-and-reset">
    /* Remove tap highlight & customize safe areas for iOS */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      touch-action: manipulation;
    }
  </style>
<style data-purpose="typography-enhancements">
    .clb-heading-shadow {
      text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.45);
    }
    .clb-subtext-shadow {
      text-shadow: 0px 1px 4px rgba(0, 0, 0, 0.5);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="h-full bg-slate-900 flex justify-center items-center overflow-x-hidden font-sans antialiased selection:bg-clb-orange selection:text-white">
<!-- BEGIN: Mobile Device Frame (iPhone 375x812 Target) -->
<div class="relative w-full max-w-[412px] h-[100dvh] sm:h-[844px] sm:max-h-[92vh] sm:rounded-[44px] overflow-hidden shadow-2xl bg-gradient-to-b from-[#0a2f73] via-[#1051b8] to-[#0d3f94] flex flex-col justify-between" data-purpose="mobile-viewport-container">
<!-- BEGIN: iOS Status Bar Simulation (Visible on larger previews) -->
<div class="w-full pt-3 px-7 flex justify-between items-center text-white/90 text-xs font-semibold z-30 select-none" data-purpose="ios-status-bar">
<span class="tracking-tight">9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 16 16">
<path d="M1 11h2v3H1v-3zm4-3h2v6H5V8zm4-3h2v9H9V5zm4-3h2v12h-2V2z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 16 16">
<path d="M8 12a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.24-2.83a6 6 0 0 1 8.48 0l-1.06 1.06a4.5 4.5 0 0 0-6.36 0l-1.06-1.06zm-2.83-2.83a10 10 0 0 1 14.14 0l-1.06 1.06a8.5 8.5 0 0 0-12.02 0L.93 6.34z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-white/80 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-white rounded-2xs"></div>
</div>
</div>
</div>
<!-- END: iOS Status Bar Simulation -->
<!-- BEGIN: Navigation / Brand Header -->
<header class="relative z-20 px-6 pt-2 pb-1 flex items-center justify-between" data-purpose="brand-header">
<div class="flex items-center space-x-3">
<!-- Thumbs-up Candidate Icon Seal -->
<div class="w-10 h-10 rounded-full border-2 border-white/90 bg-[#0e3b85] shadow-md flex items-center justify-center p-1.5 shrink-0">
<svg class="w-full h-full text-white fill-current" viewbox="0 0 24 24">
<path d="M2 20h2c.55 0 1-.45 1-1v-9c0-.55-.45-1-1-1H2v11zm19.83-7.12c.11-.25.17-.52.17-.8V11c0-1.1-.9-2-2-2h-5.5l.92-4.65c.05-.22.02-.46-.08-.66-.23-.45-.52-.86-.88-1.22L14 2 7.59 8.41C7.22 8.79 7 9.3 7 9.83v7.84C7 18.95 8.05 20 9.34 20h8.11c.7 0 1.36-.37 1.72-.97l2.66-4.43z"></path>
</svg>
</div>
<!-- Logo Typography -->
<div class="flex flex-col">
<span class="text-[10px] tracking-[0.16em] uppercase font-bold text-white leading-tight">Carmen Ligia</span>
<span class="text-base tracking-wider uppercase font-black text-white leading-none">Barceló</span>
</div>
</div>
<!-- Accent Decorative Lines (Blue & Orange) -->
<div class="flex flex-col space-y-1 items-end pr-1">
<div class="w-10 h-1 rounded-full bg-gradient-to-r from-transparent to-[#009fe3]"></div>
<div class="w-7 h-1 rounded-full bg-clb-orange"></div>
</div>
</header>
<!-- END: Navigation / Brand Header -->
<!-- BEGIN: Hero Campaign Graphic & Visual Presentation -->
<main class="relative flex-1 flex flex-col justify-between px-6 pt-1 pb-2 z-10" data-purpose="hero-candidate-content">
<!-- Headline & Campaign Slogans -->
<section class="z-20 pt-1" data-purpose="campaign-headings">
<!-- Province Badge -->
<div class="inline-block">
<span class="text-[12px] font-black uppercase tracking-wider text-clb-orange bg-white/10 px-2 py-0.5 rounded backdrop-blur-xs">
            Hato Mayor
          </span>
</div>
<!-- Main Slogan -->
<h1 class="clb-heading-shadow font-black uppercase text-left leading-[1.03] mt-1.5 text-white tracking-tight text-[28px] max-w-[270px]">
          ¡Trabajemos <br/>
<span class="text-white">Juntos</span> <span class="text-xs font-bold tracking-normal lowercase align-middle">por un</span> <br/>
<span class="text-clb-orange italic tracking-tighter text-[32px] block mt-0.5">Mejor</span>
<span class="text-white text-[25px]">Futuro Para</span> <br/>
<span class="text-clb-orange text-[26px]">Todos!</span>
</h1>
</section>
<!-- Candidate Portrait Image with subtle backdrop lighting -->
<div class="absolute inset-x-0 bottom-16 top-10 flex justify-center items-end pointer-events-none z-0" data-purpose="candidate-photo-wrapper">
<!-- Soft backlight glow -->
<div class="absolute w-72 h-72 rounded-full bg-blue-400/20 blur-3xl bottom-10"></div>
<img alt="Carmen Ligia Barceló" class="w-full max-h-[82%] object-contain object-bottom drop-shadow-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmaTDmNdrkUw23T77qSydr8So516mF0ffzD5FioCrgn6Vxqz5nAiLfAkWd7-btsdxV_nR9BzSSjlP_asOjl9MPW56M3D55KhfwhBnew08maGheahUnAfhSwvwRp2D8q95sMdWQGOC6gGzMaaXwaCjC80ZeUgN3Q004ld8Ck-Df20VK54FFG-c1JJR0on4VXLpd_s9INq7FiupECAE9UO6XLpxFzbmCUNnL7j4Id6MUyLER5gIei03u"/>
</div>
<!-- Secondary Sub-Slogan -->
<div class="relative z-20 mt-auto pb-3" data-purpose="secondary-slogan">
<p class="clb-subtext-shadow text-white/95 italic font-medium text-base tracking-wide text-left pl-1">
          Gente organizada, <br/>
<span class="font-normal text-white/90">un mejor futuro.</span>
</p>
</div>
<!-- Action Buttons Container -->
<div class="relative z-30 flex flex-col space-y-2.5 w-full" data-purpose="primary-actions">
<!-- Join Project Solid Button -->
<button aria-label="Unirme al proyecto" class="w-full py-3.5 px-6 rounded-full bg-clb-orange hover:bg-clb-orange-hover active:scale-[0.98] transition-all duration-150 shadow-lg shadow-orange-950/30 flex items-center justify-center border-t border-orange-300/40 text-white font-extrabold uppercase tracking-wide text-sm" type="button">
          ¡Unirme al proyecto!
        </button>
<!-- Log In Action Button with User Profile Icon -->
<button aria-label="Iniciar sesión" class="w-full py-3.5 px-6 rounded-full bg-clb-orange hover:bg-clb-orange-hover active:scale-[0.98] transition-all duration-150 shadow-lg shadow-orange-950/30 flex items-center justify-center space-x-2 text-white font-extrabold uppercase tracking-wide text-sm" type="button">
<!-- User / Account Icon Inside Circle -->
<div class="w-5 h-5 rounded-full border border-white flex items-center justify-center shrink-0">
<svg class="w-3.5 h-3.5 fill-current text-white" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" fill-rule="evenodd"></path>
</svg>
</div>
<span>Iniciar sesión</span>
</button>
</div>
</main>
<!-- END: Hero Campaign Graphic & Visual Presentation -->
<!-- BEGIN: Footer Accreditation -->
<footer class="relative z-20 px-4 pt-1 pb-5 text-center flex flex-col items-center" data-purpose="country-brand-footer">
<!-- Mini Dominican Flag Color Bar -->
<div class="flex items-center space-x-1 mb-1">
<div class="w-3.5 h-0.5 bg-[#002f6c] rounded-full"></div>
<div class="w-3 h-0.5 bg-white rounded-full"></div>
<div class="w-3.5 h-0.5 bg-[#ce1126] rounded-full"></div>
</div>
<p class="text-[9px] uppercase tracking-[0.14em] font-bold text-white/80 leading-none">
        República Dominicana
      </p>
<p class="text-[8px] uppercase tracking-[0.18em] font-medium text-white/60 mt-1">
        Trabajo • Organización • Resultados
      </p>
<!-- iOS Home Indicator bar for authentic mobile look -->
<div class="w-32 h-1 bg-white/40 rounded-full mt-3"></div>
</footer>
<!-- END: Footer Accreditation -->
</div>
<!-- END: Mobile Device Frame -->
</body></html>
